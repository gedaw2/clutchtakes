<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}clutchtakes{% endblock %}</title>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; color: #1a1a1a; }
        nav { margin-bottom: 32px; display: flex; gap: 16px; }
        nav a { text-decoration: none; color: #1a1a1a; font-weight: 600; }
        h1 { font-size: 1.4rem; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 8px 4px; border-bottom: 1px solid #eee; }
        .pair { display: flex; gap: 16px; margin-top: 24px; }
        .card { flex: 1; border: 1px solid #ddd; border-radius: 8px; padding: 16px; text-align: left; background: none; font: inherit; cursor: pointer; }
        .card:hover { border-color: #333; }
        .card h3 { margin: 0 0 4px; }
        .card .meta { color: #666; font-size: 0.9rem; margin-bottom: 8px; }
        .empty { color: #666; }
    </style>
</head>
<body>
    <nav>
        <a href="{% url 'ranked_list' %}">Rankings</a>
        <a href="{% url 'game_list' %}">Games</a>
        <a href="{% url 'compare' %}">Compare</a>
    </nav>
    {% block content %}{% endblock %}
</body>
</html>
